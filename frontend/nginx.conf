events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 3000;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Handle React Router
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Imports post whole sales files; reports and the Excel export can
        # take a while on a large forecast.
        client_max_body_size 50m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # API proxy to backend. $http_host keeps the port the client used
        # (localhost:3000); $host would drop it.
        location /api/ {
            proxy_pass http://fastapi:8000/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MCP endpoint for Claude Code / Codex, so http://localhost:3000/mcp
        # works as well as http://localhost:8000/mcp. The MCP server checks
        # the Host header against MCP_ALLOWED_HOSTS (localhost / 127.0.0.1 on
        # any port by default), so the original Host, port included, must
        # reach it. Exact /mcp (no redirect to /mcp/: not every client
        # follows a redirect on POST).
        location = /mcp {
            proxy_pass http://fastapi:8000/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
        }
        location /mcp/ {
            proxy_pass http://fastapi:8000/mcp/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript;
    }
} 