events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 3000;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Resolve the API container through Docker's embedded DNS at request
        # time instead of at config load. A literal host in proxy_pass is
        # resolved once at start-up, so nginx died with "host not found in
        # upstream fastapi" whenever this container came up before the API
        # (or was restarted while the API was down). With a variable the
        # name is looked up per request and re-checked every 10 s, so the
        # frontend starts regardless and recovers once the API is reachable
        # (a request made while it is down gets 502 instead of a dead
        # container).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://fastapi:8000;

        # Handle React Router
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Imports post whole sales files; reports and the Excel export can
        # take a while on a large forecast.
        client_max_body_size 50m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # API proxy to backend. $http_host keeps the port the client used
        # (localhost:3000); $host would drop it. proxy_pass with a variable
        # does not strip the location prefix itself, so /api/ is rewritten
        # away first (query string is kept).
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MCP endpoint for Claude Code / Codex, so http://localhost:3000/mcp
        # works as well as http://localhost:8000/mcp. The MCP server checks
        # the Host header against MCP_ALLOWED_HOSTS (localhost / 127.0.0.1 on
        # any port by default), so the original Host, port included, must
        # reach it. Exact /mcp (no redirect to /mcp/: not every client
        # follows a redirect on POST).
        location = /mcp {
            proxy_pass $api/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
        }
        location /mcp/ {
            proxy_pass $api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript;
    }
} 