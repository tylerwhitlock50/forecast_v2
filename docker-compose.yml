services:
  fastapi:
    build: ./app
    container_name: forecast-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./app:/app
      - ./scripts:/scripts
    environment:
      # Set to 'true' to force reload CSV data over existing database
      - FORCE_DB_RELOAD=false
    networks:
      - forecast-network

  frontend:
    build: ./frontend
    container_name: forecast-frontend
    ports:
      - "3000:3000"
    depends_on:
      - fastapi
    networks:
      - forecast-network

networks:
  forecast-network:
    driver: bridge
