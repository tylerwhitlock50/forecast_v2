services:
  fastapi:
    build: ./app
    container_name: forecast-api
    # Host ports default off 8000/3000 (used by other local stacks); override
    # with API_PORT / FRONTEND_PORT in .env.
    ports:
      - "${API_PORT:-8100}:8000"
    volumes:
      - ./data:/data
      - ./app:/app
      - ./scripts:/scripts
    environment:
      # Set to 'true' to force reload CSV data over existing database
      - FORCE_DB_RELOAD=false
      # MCP endpoint (/mcp, also proxied by the frontend at :3000/mcp)
      # accepts Host localhost / 127.0.0.1 / [::1] (any port) only, as
      # DNS-rebinding protection. Add the host:port the client uses, comma-
      # separated, when it connects another way, e.g. in a .env file:
      #   Claude Code on another machine:   MCP_ALLOWED_HOSTS=192.168.1.20:*
      #   Claude Code in a dev container:   MCP_ALLOWED_HOSTS=host.docker.internal:*
      # A refused Host gets HTTP 421; a refused browser Origin gets 403
      # (MCP_ALLOWED_ORIGINS, e.g. http://192.168.1.20:*).
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-}
      # Largest MCP tool result in characters before the tool asks for a
      # narrower request (Claude Code rejects results over ~25k tokens; 60000 chars
      # of compact JSON is about 20k tokens); 0 = off.
      - MCP_MAX_RESPONSE_CHARS=${MCP_MAX_RESPONSE_CHARS:-60000}
    # The slim image has no curl, so probe GET / with Python. The frontend
    # waits for this to pass before it starts (depends_on below).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - forecast-network

  frontend:
    build: ./frontend
    container_name: forecast-frontend
    ports:
      - "${FRONTEND_PORT:-3100}:3000"
    # Start only once the API answers; nginx also resolves the API name per
    # request (frontend/nginx.conf), so it no longer dies with "host not
    # found in upstream fastapi" when the API is late or restarting.
    depends_on:
      fastapi:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - forecast-network

networks:
  forecast-network:
    driver: bridge
